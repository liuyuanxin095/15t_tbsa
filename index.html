<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>TBSA 企劃表單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Layout: sticky toolbar, step rail on the left (tabs on phones), one form sheet per step in the main column. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#172033; --mute:#5b6678; --line:#d3dae6;
  --head:#e6ebf3; --accent:#1d4e89; --on-accent:#ffffff; --accent-soft:#e1ebf7; --ok:#2e7d57; --warn:#b4571b;
  --c1:#2f6fde; --c2:#0e8f80; --c3:#c97a00; --c4:#c93f66; --c5:#6d51c9; --pill-ink:#ffffff;
  --ex:#fff8db; --exline:#e9c94a; --pit-bg:#fdf0f2; --pit-ink:#7d2440; --tip-bg:#eef6f4; --tip-ink:#21514b;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif; --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1420; --surface:#162033; --ink:#e5eaf3; --mute:#99a5b8; --line:#2a3752;
  --head:#1d2a41; --accent:#86b6ef; --on-accent:#0e1a2e; --accent-soft:#1c2d4a; --ok:#6cc79a; --warn:#f0a06a; --c1:#7fa8f0; --c2:#4cc0b0; --c3:#e0a24a; --c4:#ee7c9c; --c5:#a590ee; --pill-ink:#0e1a2e; --ex:#2b2917; --exline:#6b5e1d; --pit-bg:#3a1f28; --pit-ink:#f3b4c6; --tip-bg:#17302d; --tip-ink:#a9dcd3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1420; --surface:#162033; --ink:#e5eaf3; --mute:#99a5b8; --line:#2a3752;
  --head:#1d2a41; --accent:#86b6ef; --on-accent:#0e1a2e; --accent-soft:#1c2d4a; --ok:#6cc79a; --warn:#f0a06a; --c1:#7fa8f0; --c2:#4cc0b0; --c3:#e0a24a; --c4:#ee7c9c; --c5:#a590ee; --pill-ink:#0e1a2e; --ex:#2b2917; --exline:#6b5e1d; --pit-bg:#3a1f28; --pit-ink:#f3b4c6; --tip-bg:#17302d; --tip-ink:#a9dcd3; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--serif);font-size:18px;letter-spacing:.02em}
.brand span{color:var(--mute);font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.saved{font-size:13px;color:var(--mute);min-width:5.5em}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.warn{color:var(--warn)}
.btn.sm{padding:2px 9px;font-size:13px}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;padding-top:20px;align-items:start}
nav.rail{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:4px}
.tab{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:8px 10px;cursor:pointer}
.tab:hover{background:var(--surface)}
.tab[aria-current="page"]{background:var(--surface);border-color:var(--line)}
.tab .n{grid-row:span 2;font-size:12px;font-weight:700;background:var(--accent);color:var(--on-accent);border-radius:4px;padding:2px 6px;letter-spacing:.04em}
.tab .t{font-size:14px;font-weight:500;line-height:1.3}
.tab .pg{height:3px;background:var(--line);border-radius:2px;overflow:hidden;grid-column:2}
.tab .pg i{display:block;height:100%;background:var(--ok);width:0}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;min-width:0}
.sheet h1{font-family:var(--serif);font-size:26px;line-height:1.3;margin:0 0 6px;text-wrap:balance}
.use{color:var(--mute);margin:0 0 20px;max-width:65ch;font-size:14px}
.kicker{font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:700;margin-bottom:4px}
.blk{margin-top:22px}
.blk>h3{font-size:14px;margin:0 0 8px;background:var(--head);padding:5px 10px;border-radius:4px;letter-spacing:.04em}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.lb{font-size:13px;font-weight:700}
.lb small{display:block;font-weight:400;color:var(--mute);font-size:12px}
input[type=text],textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;resize:vertical;line-height:1.55}
textarea{overflow:hidden;resize:none}
input[type=text]:focus,textarea:focus{background:var(--surface);border-color:var(--accent)}
::placeholder{color:var(--mute);opacity:.65}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.cat{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;background:var(--bg)}
.cat:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.cat input{accent-color:var(--accent);width:16px;height:16px}
.cat input[type=text]{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:2px 4px;background:transparent}
.toc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.toc button{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px;cursor:pointer}
.toc button:hover{border-color:var(--accent)}
.toc .n{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.08em}
.toc .t{font-weight:500}
.toc .pg{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.toc .pg i{display:block;height:100%;background:var(--ok)}
.toc .c{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;min-width:640px}
table.t th,table.t td{border:1px solid var(--line);padding:6px;vertical-align:top}
table.t th{background:var(--head);font-size:13px;text-align:left}
table.t th.rh{width:130px}
table.t th small{display:block;font-weight:400;color:var(--mute);font-size:11px}
table.t textarea,table.t input[type=text]{border-color:transparent;background:transparent;padding:4px 6px}
table.t textarea:focus,table.t input[type=text]:focus{border-color:var(--accent);background:var(--surface)}
.swot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.swot .hd{background:var(--head);border-radius:6px;padding:6px 10px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.swot .hd small{font-weight:400;color:var(--mute);font-size:12px;text-align:right}
.swot .cell{display:flex;flex-direction:column;gap:6px;min-width:0}
.swot .corner{font-size:12px;color:var(--mute);display:flex;flex-direction:column;justify-content:center;padding:6px 10px;border:1px dashed var(--line);border-radius:6px}
.swot .x .hd{background:var(--accent-soft)}
.map{position:relative;aspect-ratio:1/1;max-width:420px;width:100%;margin:12px auto;border:1px solid var(--line);background:var(--bg);border-radius:6px;touch-action:none;user-select:none}
.map::before,.map::after{content:"";position:absolute;background:var(--line)}
.map::before{left:50%;top:0;bottom:0;width:1px}.map::after{top:50%;left:0;right:0;height:1px}
.ax{position:absolute;font-size:12px;color:var(--mute);max-width:40%;text-align:center;pointer-events:none}
.ax.t{top:4px;left:50%;transform:translateX(-50%)}.ax.b{bottom:4px;left:50%;transform:translateX(-50%)}
.ax.l{left:4px;top:50%;transform:translateY(-50%)}.ax.r{right:4px;top:50%;transform:translateY(-50%)}
.dot{position:absolute;transform:translate(-50%,-50%);cursor:grab;display:flex;flex-direction:column;align-items:center;gap:2px;max-width:110px}
.dot i{width:16px;height:16px;border-radius:50%;background:var(--mute);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--mute)}
.dot.me i{background:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dot span{font-size:12px;background:var(--surface);padding:0 5px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px;border:1px solid var(--line)}
.axes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.pt{display:flex;gap:8px;align-items:center}
.total{margin-top:10px;display:flex;gap:8px;align-items:baseline;justify-content:flex-end;font-variant-numeric:tabular-nums}
.total b{font-size:18px;color:var(--accent)}
.hint{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:12px}
.panel textarea{height:140px;overflow:auto;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.panel .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;font-size:14px;z-index:30;max-width:90vw}
.by{display:block;font-size:11px;color:var(--mute);line-height:1.4;min-height:0}
.by:empty{display:none}
table.t .by{padding:0 6px 2px}
.whoami{display:flex;align-items:center;gap:6px;font-size:13px;flex-wrap:wrap}
.whoami b{font-weight:700}
.whoami input{width:9em;border:1px solid var(--accent);border-radius:6px;padding:3px 8px;background:var(--surface)}
.whoami.need b{color:var(--warn)}
.gate{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.gate[hidden]{display:none}
.gcard h2{margin:0;font-family:var(--serif);font-size:22px}
.gcard p{margin:0;color:var(--mute);font-size:14px}
.gerr{color:var(--warn);font-size:13px;min-height:1.4em}
.mode{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 10px;color:var(--mute);white-space:nowrap}
.mode.on{color:var(--ok);border-color:var(--ok)}
.banner{background:var(--accent-soft);border-radius:6px;padding:8px 12px;margin:0 0 16px;font-size:14px}
table.w{border-collapse:collapse;width:100%;min-width:480px}
table.w th,table.w td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;font-size:14px}
table.w th{font-size:12px;color:var(--mute);font-weight:500}
table.w td.num,table.w th.num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:12px;background:var(--accent-soft);border-radius:4px;padding:0 6px;margin:0 4px 2px 0;white-space:nowrap}
.who-note{font-size:13px;color:var(--mute);margin:0 0 8px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;color:var(--pill-ink);letter-spacing:.04em}
.hbtn{display:inline-grid;place-items:center;width:18px;height:18px;margin-left:6px;border-radius:50%;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:12px;font-weight:700;line-height:1;cursor:pointer;padding:0;vertical-align:middle}
.hbtn:hover,.hbtn[aria-expanded="true"]{background:var(--accent);color:var(--on-accent)}
.swot .hr{display:flex;align-items:center;gap:4px}
.intro{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px}
.intro p{margin:6px 0 0}
.rels{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.rl{font-size:12px;color:var(--mute);font-weight:700;min-width:5.5em}
.rchip{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 9px;font-size:12.5px;cursor:pointer}
.rchip:hover{border-color:var(--accent)}
.chk{display:flex;flex-direction:column;gap:2px}
.cki{display:flex;gap:8px;align-items:flex-start;padding:4px 0;cursor:pointer;font-size:14px}
.cki input{margin-top:5px;accent-color:var(--accent)}
.ckn{margin-left:8px;font-weight:400;color:var(--mute);font-variant-numeric:tabular-nums}
.cprog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.cprog i{display:block;height:100%;width:0;transition:width .3s}
.tipbox{margin-top:12px;background:var(--tip-bg);color:var(--tip-ink);border-radius:8px;padding:10px 12px;font-size:14px}
.howto{display:flex;flex-direction:column;gap:6px;font-size:14px;margin:0;padding-left:18px}
.verbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--mute);margin-bottom:8px}
.drawer{position:fixed;z-index:15;background:var(--surface);color:var(--ink);overflow:auto;padding:16px;box-shadow:0 0 24px rgba(0,0,0,.12)}
.drawer[hidden]{display:none}
@media (min-width:1101px){.drawer{top:0;right:0;bottom:0;width:380px;border-left:1px solid var(--line)}body.has-drawer{padding-right:396px}}
@media (max-width:1100px){.drawer{left:0;right:0;bottom:0;max-height:58vh;border-top:1px solid var(--line);border-radius:12px 12px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}body.has-drawer{padding-bottom:60vh}}
.dtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.drawer h3{margin:0;font-size:17px;font-family:var(--serif);line-height:1.4}
.drawer h4{margin:14px 0 4px;font-size:12px;letter-spacing:.06em;color:var(--mute)}
.drawer p{margin:0;font-size:14px}
.drawer ul{margin:0;padding-left:18px;font-size:14px}
.dmute{color:var(--mute)}
.pit{background:var(--pit-bg);color:var(--pit-ink);border-radius:6px;padding:8px 10px;font-size:13.5px}
.exd{margin-top:14px;border:1px solid var(--exline);border-radius:8px;background:var(--ex)}
.exd summary{cursor:pointer;padding:8px 12px;font-weight:700;font-size:14px}
.exb{padding:0 12px 10px;font-size:13.5px}
.exb ul,.exb ol{margin:0;padding-left:18px}
.exb p{margin:0 0 4px}
.exb .exn{font-size:12px;color:var(--mute);margin-top:8px}
.exl{list-style:none;padding:0!important}.exl li{margin-bottom:6px}.exl b{display:block;font-size:12px;color:var(--mute)}
.from{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:0 6px;margin-right:4px;color:#fff}
.drawer ul.rel{list-style:none;padding:0}
.rel li{padding:6px 8px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;cursor:pointer;font-size:13.5px}
.rel li:hover{border-color:var(--accent)}
.rel li small{display:block;color:var(--mute)}
.flash{animation:flash 1.4s ease 2}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 4px var(--accent)}}
.foot{margin-top:24px;font-size:12px;color:var(--mute);max-width:80ch}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.rail{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .tab{min-width:150px;flex:none}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:minmax(0,1fr)}
  .axes{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:600px){
  .g2{grid-template-columns:minmax(0,1fr)}.sheet{padding:16px}
  .swot{grid-template-columns:minmax(0,1fr)}.swot .corner{display:none}
  .brand span{display:none}
}
@media (prefers-reduced-motion:no-preference){.tab,.btn,.toc button{transition:border-color .15s,background .15s}}
</style>
</head>
<body>


<div class="wrap">
  <header class="bar">
    <div class="brand"><b>TBSA 企劃表單</b><span>第 15 屆全國大專創新企劃競賽</span></div>
    <div class="tools">
      <span class="whoami" id="whoami"></span>
      <span class="mode" id="mode">僅存本機</span>
      <span class="saved" id="saved" aria-live="polite">自動儲存</span>
      <button class="btn pri" id="bCopy" type="button">複製成文字</button>
      <button class="btn" id="bData" type="button">備份 / 還原</button>
      <button class="btn warn" id="bReset" type="button">清空</button>
    </div>
  </header>
  <div id="panel" class="panel" hidden>
    <div class="lb">備份 / 還原<small>資料只存在這個瀏覽器。換裝置或清除瀏覽資料前，請先複製備份代碼存起來。</small></div>
    <textarea id="dataBox" aria-label="備份代碼" placeholder="複製備份後代碼會出現在這裡。要還原時，把代碼貼在這裡再按「還原」。"></textarea>
    <div class="row">
      <button class="btn" id="bBackup" type="button">複製備份代碼</button>
      <button class="btn pri" id="bRestore" type="button">還原貼上的代碼</button>
      <button class="btn" id="bClosePanel" type="button">關閉</button>
    </div>
  </div>
  <div class="layout">
    <nav class="rail" id="rail" aria-label="表單步驟"></nav>
    <main id="main" class="sheet"></main>
  </div>
  <p class="foot">本企劃表單為 WBSA 商務策劃師聯合會台灣辦事處所授權，僅提供「TBSA 商務企劃能力檢定」企劃學習之使用，非經授權勿用於他處。</p>
</div>
<div class="toast" id="toast" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="填寫說明"><div class="dtop"><span class="dmute" style="font-size:12px">填寫說明</span><button class="btn sm" id="dClose" type="button">關閉</button></div><div id="dBody"></div></aside>
<div class="gate" id="gate" hidden>
  <form class="gcard" id="gform" autocomplete="off">
    <h2 id="gtitle">登入</h2>
    <p id="gtext">請輸入你的學號。學號只用來確認你是組員，不會顯示給其他人。</p>
    <input type="text" id="gid" aria-label="學號" autocomplete="off" autocapitalize="off">
    <div class="gerr" id="gerr" aria-live="polite"></div>
    <button class="btn pri" id="gbtn" type="submit">登入</button>
  </form>
</div>

<script>
var TEACH=(function(){
/* ================= DATA ================= */
const STEPS = [
  {n:1, key:'f1', name:'企劃情報／概念分析表', short:'企劃情報', color:'#2F6FDE', verb:'看清楚', q:'為什麼要做？外部發生什麼、我們手上有什麼？',
   usage:'將企劃目的，透過內外情報分析，確立企劃案的核心概念與企劃構想。',

    var it=d.del?{k:k,del:1}:{k:k,v:d.v,at:d.at,l:d.l,t:d.t};
    sPend.push(it);sWait.push([res,rej]);clearTimeout(sTimer);sTimer=setTimeout(sheetSend,900);
  });
}
function sheetSend(){
  var items=sPend,w=sWait;sPend=[];sWait=[];
  sheetPost({id:SID,items:items}).then(function(j){
    if(j&&j.ok)w.forEach(function(x){x[0]()});
    else{if(j&&j.error==='noid')needLogin('學號已失效，請重新登入。');w.forEach(function(x){x[1]({code:'fail'})})}
  },function(){w.forEach(function(x){x[1]({code:'fail'})})});
}
function sheetPull(){
  if(!SID||document.hidden)return;
  sheetGet('id='+encodeURIComponent(SID)).then(function(j){
    if(j&&j.error){if(j.error==='noid')needLogin('學號已失效，請重新登入。');else $('#saved').textContent='同步失敗';return}
    var data=(j&&j.data)||{},ids=Object.keys(data),ch=[];
    NICK=j.roster||NICK;
    if(j.me){MYNICK=j.me.nick||'';CUR=j.me.code;if(!$('#nickIn'))renderWhoami()}
    Object.keys(sPrev).forEach(function(k){if(!data[k])ch.push({type:'removed',doc:{id:k}})});
    sPrev=data;
    if(!Object.keys(dirty).length&&!Object.keys(writing).length)$('#saved').textContent='已同步';
    onSnap({docs:ids.map(function(k){return {id:k,exists:true,data:function(){return data[k]}}}),empty:!ids.length,docChanges:function(){return ch}});
  },function(){$('#saved').textContent='同步失敗，稍後重試'});
}
function sheetRename(n){
  return sheetPost({id:SID,action:'rename',nick:n}).then(function(j){
    if(j&&j.ok){MYNICK=n;NICK[CUR]=n;renderWhoami();refreshBy();fillWho();toast('已更新暱稱');return true}
    toast(j&&j.error==='noid'?'學號已失效，請重新登入':'暱稱沒有儲存成功');return false;
  },function(){toast('連線失敗，暱稱沒有儲存');return false});

/* --- login gate --- */
var gateMode='id';
function showGate(mode,msg){
  gateMode=mode||'id';
  $('#gtitle').textContent=gateMode==='id'?'登入':'設定暱稱';
  $('#gtext').textContent=gateMode==='id'?'請輸入你的學號。學號只用來確認你是組員，不會顯示給其他人。':'第一次登入，請設定一個暱稱。之後每一欄會顯示這個暱稱，隨時可以再改。';
  $('#gid').value='';$('#gid').setAttribute('aria-label',gateMode==='id'?'學號':'暱稱');$('#gid').maxLength=gateMode==='id'?30:12;
  $('#gerr').textContent=msg||'';$('#gbtn').textContent=gateMode==='id'?'登入':'儲存暱稱';
  $('#gate').hidden=false;setTimeout(function(){$('#gid').focus()},50);
}
function needLogin(msg){SID='';try{localStorage.removeItem('tbsa15-sid')}catch(e){};MYNICK='';renderWhoami();showGate('id',msg)}
function loginOk(res){
  SID=res.sid||SID;CUR=res.code;MYNICK=res.nick||'';if(res.nick)NICK[res.code]=res.nick;
  renderWhoami();
  if(!MYNICK){showGate('nick');return}
  $('#gate').hidden=true;
  if(!polling){polling=true;setInterval(sheetPull,6000);document.addEventListener('visibilitychange',function(){if(!document.hidden)sheetPull()})}
  sheetPull();
}
function submitGate(){
  var v=$('#gid').value.trim();if(!v){$('#gerr').textContent=gateMode==='id'?'請輸入學號':'請輸入暱稱';return}
  $('#gbtn').disabled=true;
  if(gateMode==='id'){
    sheetGet('action=login&id='+encodeURIComponent(v)).then(function(j){
      $('#gbtn').disabled=false;
      if(j&&j.ok){try{localStorage.setItem('tbsa15-sid',v)}catch(e){};loginOk({sid:v,code:j.code,nick:j.nick})}
      else $('#gerr').textContent=j&&j.error==='noid'?'找不到這個學號。請確認輸入正確，或請管理者把你加到試算表的「組員名單」。':'登入失敗，請稍後再試';
    },function(){$('#gbtn').disabled=false;$('#gerr').textContent='連線失敗，請檢查網路或網址設定'});
  }else{
    saveNick(v).then(function(ok){$('#gbtn').disabled=false;if(ok){$('#gate').hidden=true;if(!polling)loginOk({code:CUR,nick:MYNICK});else sheetPull()}});
  }
}
function initSheet(cfg){
  sCfg=cfg;SHEETMODE=true;CANW=true;CANADMIN=false;DB={sheet:1};CUR='';
  coll={doc:function(k){return {set:function(d){return sheetPush(k,d)},delete:function(){return sheetPush(k,{del:1})}}}};
  var m=$('#mode');m.textContent='Google 試算表';m.className='mode on';m.title='內容會同步到共用的 Google 試算表';
  $('#bReset').hidden=true;
  $('#saved').textContent='請先登入';renderWhoami();
  if(SID){
    sheetGet('action=login&id='+encodeURIComponent(SID)).then(function(j){
      if(j&&j.ok)loginOk({sid:SID,code:j.code,nick:j.nick});else showGate('id',j&&j.error==='noid'?'學號已失效，請重新登入。':'');
    },function(){showGate('id','連線失敗，請檢查網路後重新整理')});
  }else showGate('id');
}
function noShare(msg){
  WHY=msg;var m=$('#mode');m.textContent='僅存本機';m.className='mode';m.title=msg;fillWho();
}
function initShared(){
  if(!(window.claude&&window.claude.use)){
    var cfg=sheetCfg();
    if(cfg.url){initSheet(cfg);return}
    noShare('尚未設定 Google 試算表同步(管理者要在檔案開頭的 SHEET_URL 填入網址)。');return}
  Promise.all([window.claude.use('user'),window.claude.use('db')]).then(function(r){
    var u=r[0],d=r[1];
    if(!u||!d){noShare('目前的開啟方式沒有提供共用資料功能。請在 Claude 網站或 App 內開啟這個 artifact，並重新整理頁面。');return}
    window.USERNS=u;
    return u.me().then(function(me){
      if(!me||!me.id){noShare('沒有登入 Claude，無法與隊友共用資料。');return}
      ME=me;
      return Promise.all([u.can('data.write'),u.canEdit()]).then(function(c){
        CANW=c[0]!==false;CANADMIN=!!c[1];
        DB=d;coll=d.collection('fields');
        P[me.id]={id:me.id,name:me.name||'',isMe:true};
        var m=$('#mode');m.textContent='多人共用';m.className='mode on';$('#saved').textContent='同步中…';
        coll.onSnapshot(onSnap,function(){$('#saved').textContent='同步中斷';});
        if(cur==='cover')renderPage('cover',true);else applyRO();
      });
    });
  }).catch(function(){noShare('連線共用資料時發生錯誤，請重新整理頁面。')});
}
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2400)}

function keysOf(st){
  var ks=[];
  (st.secs||[]).forEach(function(s){s.f.forEach(function(f){ks.push(f.k)})});
  if(st.swot)SW.forEach(function(x){ks.push('sw_'+x[0])});
  if(st.stp){ks.push('prodname','target','feat','posstmt');['a','b','c'].forEach(function(c){SEGV.forEach(function(r){ks.push('seg_'+c+'_'+r[0])});ks.push('seg_'+c+'_x')})}
  if(st.p7){P7.forEach(function(p){ks.push('p7_'+p[0])});AIDAS.forEach(function(a,i){ks.push('ai'+i+'_act','ai'+i+'_goal','ai'+i+'_bud','ai'+i+'_note')})}
  if(st.one)ks.push('o_name','o_goal','o_eff','o_what','o_who','o_cost','o_how');
  return ks;
}
function progress(st){
  var ks=keysOf(st),n=0;
  ks.forEach(function(k){if(S[k]&&String(S[k]).trim())n++});
  return {n:n,total:ks.length};
}
function coverProgress(){
  var ks=['c_topic','c_num','c_team'],n=0,tot=4;
  ks.forEach(function(k){if(S[k]&&String(S[k]).trim())n++});
  if(CATS.some(function(_,i){return S['cat'+i]})||S.cat_other)n++;
  return {n:n,total:tot};
}

      });
      o.push('**目標市場(Targeting)**','',v('target'),'','**產品或服務的功能 / 特色**','',v('feat'),'','### 市場定位(Positioning)','');
      o.push('座標軸：上「'+(S.ax_t||'')+'」/ 下「'+(S.ax_b||'')+'」/ 左「'+(S.ax_l||'')+'」/ 右「'+(S.ax_r||'')+'」');
      pts().forEach(function(d){o.push('- '+d.n+':橫 '+Math.round(d.x*100)+'%、縱 '+Math.round((1-d.y)*100)+'%')});
      o.push('','**定位聲明**','',v('posstmt'),'');
    }
    if(st.p7){
      o.push('### 行銷戰術設計(7Ps)','');P7.forEach(function(p){o.push('**'+p[1]+'(' +p[2]+')**','',v('p7_'+p[0]),'')});
      o.push('### 行銷活動設計','','| 顧客心理程序 | 行動溝通活動 | 成果目標 | 預算 | 備註 |','|---|---|---|---|---|');
      var cl=function(k){return (S[k]||'').toString().replace(/\n/g,'<br>').replace(/\|/g,'/')};
      AIDAS.forEach(function(a,i){o.push('| '+a[0]+' | '+cl('ai'+i+'_act')+' | '+cl('ai'+i+'_goal')+' | '+cl('ai'+i+'_bud')+' | '+cl('ai'+i+'_note')+' |')});
      o.push('','預算合計：'+sum().toLocaleString('zh-TW')+' 元','');
    }
    if(st.one){
      o.push('**企劃案名稱**:'+v('o_name'),'');
      [['o_goal','1、目的 / 目標'],['o_eff','1、效益'],['o_what','2、內容要點(What)'],['o_how','3、實施方式(How / Where / When)'],['o_who','4、執行團隊(Who)'],['o_cost','5、所需經費(How much)']].forEach(function(x){o.push('**'+x[1]+'**','',v(x[0]),'')});
    }
  });
  var by=contributors(),ids=Object.keys(by);
  if(ids.length){o.push('## 填寫紀錄','');ids.sort(function(a,b){return by[b].n-by[a].n}).forEach(function(id){o.push('- '+nameOf(id)+':'+by[id].n+' 欄(' +Object.keys(by[id].steps).join('、')+')，最近編輯 '+fmtAt(by[id].at))});o.push('')}
  return o.join('\n');
}

initShared();
window.addEventListener('hashchange',function(){var x=(location.hash||'').replace('#','');if(order().indexOf(x)>-1&&x!==cur)renderPage(x)});
})();
</script>
